<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Sir Nath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/style.css">
</head>

<body>
<div class="floaters" aria-hidden="true">
  <span style="left:6%;  top:14%; animation-delay:0s">♡</span>
  <span style="left:90%; top:22%; animation-delay:1s">✦</span>
  <span style="left:4%;  top:58%; animation-delay:2s">❀</span>
  <span style="left:93%; top:70%; animation-delay:.5s">♡</span>
  <span style="left:12%; top:88%; animation-delay:1.5s">✦</span>
</div>
<header class="hero" id="top">
  <div class="paper cover pop-in" id="cover">
    <span class="tape tape-l"></span><span class="tape tape-r"></span>
    <span class="sticker pop" style="top:-22px; left:50%; margin-left:-22px; --d:.5s">❀</span>

 
    <img src="../assets/hampter.png" width="150px" height="150px">
 

    <p class="doodle" aria-hidden="true"> </p>
    <a class="btn" id="openBtn" href="html/letter.html">Open me</a>
    <span class="sticker pop sm" style="bottom:-16px; right:24px; --d:.8s">✿</span>
  </div>
</header>

<script src="scripts/script.js"></script>
</body>
</html>
